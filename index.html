<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>후아고 에셋 허브</title>
<style>

:root{
  --brand:       #97D700;
  --brand-dark:  #000000;
  --brand-light: #F1FADB;
  --bg:          #FFFEFB;
  --ink:#000000; --gray:#8C8C8C; --white:#fff;
  --mono:'Helvetica Neue',Helvetica,Arial,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;background:var(--bg);color:var(--ink);line-height:1.7;-webkit-tap-highlight-color:transparent;word-break:keep-all;overflow-wrap:break-word;min-height:100vh}
.wrap{max-width:520px;margin:0 auto;padding:0 24px 72px}

/* HERO / BANNER */
.banner{background:var(--brand);padding:48px 24px 40px;text-align:center;margin:0 -24px}
.banner-badge{display:inline-block;background:rgba(0,0,0,.1);border:1px solid rgba(0,0,0,.3);color:#000;border-radius:100px;font-size:11px;letter-spacing:.18em;text-transform:uppercase;padding:6px 16px;margin-bottom:16px}
.banner-title{font-size:clamp(32px,10vw,44px);font-weight:900;letter-spacing:.02em;color:#000;line-height:1}
.hero-sub{font-size:13px;color:var(--ink);opacity:.65;margin-top:12px;text-align:center}

/* GATE */
#gate{padding:56px 0 0}
.gate-box{background:var(--white);border:1px solid rgba(0,0,0,.1);border-radius:16px;padding:28px 24px;text-align:center}
.gate-label{font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--gray);margin-bottom:10px}
.gate-title{font-size:17px;font-weight:900;margin-bottom:18px}
.gate-input{width:100%;text-align:center;letter-spacing:.5em;font-size:20px;font-family:var(--mono);background:var(--bg);border:1px solid rgba(0,0,0,.15);border-radius:12px;padding:14px 16px;color:var(--ink)}
.gate-input:focus{outline:none;border-color:var(--brand-dark)}
.gate-btn{width:100%;margin-top:14px;background:var(--ink);color:#fff;border:none;border-radius:12px;padding:15px;font-size:14px;font-weight:700;cursor:pointer}
.gate-error{font-size:12px;color:#c62828;margin-top:12px;display:none}
.gate-error.show{display:block}

/* ASSET LIST */
#assets{display:none;padding-top:40px}
.assets-title{font-size:15px;font-weight:700;color:var(--gray);margin-bottom:16px}
.asset-grid{display:flex;flex-direction:column;gap:12px}
.asset-card{display:flex;align-items:center;gap:16px;background:var(--white);border:1px solid rgba(0,0,0,.1);border-radius:16px;padding:18px 20px;text-decoration:none;color:var(--ink);transition:border-color .15s}
.asset-card:hover{border-color:var(--brand-dark)}
.asset-letter{flex:none;width:44px;height:44px;border-radius:12px;background:var(--brand-light);color:var(--brand-dark);font-weight:900;font-size:18px;display:flex;align-items:center;justify-content:center;font-family:var(--mono)}
.asset-info{flex:1}
.asset-name{font-size:15px;font-weight:700}
.asset-fee{font-size:11px;font-weight:700;color:var(--brand-dark);background:var(--brand-light);border-radius:100px;padding:2px 8px;margin-left:6px;vertical-align:middle}
.asset-desc{font-size:12px;color:var(--gray);margin-top:2px}
.asset-arrow{flex:none;font-size:16px;color:var(--gray)}

.footer-brand{text-align:center;font-size:22px;font-weight:900;letter-spacing:.1em;color:var(--brand-dark);opacity:.35;margin-top:48px}
</style>
</head>
<body>
<div class="wrap">

  <div class="banner">
    <div class="banner-badge">Asset Hub</div>
    <h1 class="banner-title">HOOAGO</h1>
  </div>
  <div class="hero-sub">인플루언서 가이드 에셋 관리</div>

  <!-- ░░ 비밀번호 게이트 ░░ -->
  <div id="gate">
    <div class="gate-box">
      <div class="gate-label">Protected</div>
      <div class="gate-title">비밀번호를 입력해 주세요</div>
      <input class="gate-input" type="password" id="pwInput" inputmode="numeric" maxlength="4" placeholder="••••" autocomplete="off">
      <button class="gate-btn" id="pwBtn">확인</button>
      <div class="gate-error" id="pwError">비밀번호가 올바르지 않습니다.</div>
    </div>
  </div>

  <!-- ░░ 에셋 목록 ░░ -->
  <div id="assets">
    <div class="assets-title">공개된 에셋 (4)</div>
    <div class="asset-grid">
      <a class="asset-card" href="a.html">
        <div class="asset-letter">A</div>
        <div class="asset-info"><div class="asset-name">A <span class="asset-fee">고료 5만원</span></div><div class="asset-desc">후아고 크리에이터 가이드</div></div>
        <div class="asset-arrow">→</div>
      </a>
      <a class="asset-card" href="b.html">
        <div class="asset-letter">B</div>
        <div class="asset-info"><div class="asset-name">B <span class="asset-fee">고료 10만원</span></div><div class="asset-desc">후아고 크리에이터 가이드</div></div>
        <div class="asset-arrow">→</div>
      </a>
      <a class="asset-card" href="c.html">
        <div class="asset-letter">C</div>
        <div class="asset-info"><div class="asset-name">C <span class="asset-fee">고료 20만원</span></div><div class="asset-desc">후아고 크리에이터 가이드</div></div>
        <div class="asset-arrow">→</div>
      </a>
      <a class="asset-card" href="d.html">
        <div class="asset-letter">D</div>
        <div class="asset-info"><div class="asset-name">D <span class="asset-fee">고료 30만원</span></div><div class="asset-desc">후아고 크리에이터 가이드</div></div>
        <div class="asset-arrow">→</div>
      </a>
    </div>
    <div class="footer-brand">HOOAGO</div>
  </div>

</div>

<script>
const HUB_PASSWORD = '0907';
const SESSION_KEY = 'hooago_hub_unlocked';

const gateEl = document.getElementById('gate');
const assetsEl = document.getElementById('assets');
const pwInput = document.getElementById('pwInput');
const pwBtn = document.getElementById('pwBtn');
const pwError = document.getElementById('pwError');

function unlock(){
  gateEl.style.display = 'none';
  assetsEl.style.display = 'block';
  sessionStorage.setItem(SESSION_KEY, '1');
}

function tryUnlock(){
  if (pwInput.value === HUB_PASSWORD) {
    unlock();
  } else {
    pwError.classList.add('show');
    pwInput.value = '';
    pwInput.focus();
  }
}

pwBtn.addEventListener('click', tryUnlock);
pwInput.addEventListener('keydown', function(e){
  if (e.key === 'Enter') tryUnlock();
});

if (sessionStorage.getItem(SESSION_KEY) === '1') {
  unlock();
}
</script>
</body>
</html>
